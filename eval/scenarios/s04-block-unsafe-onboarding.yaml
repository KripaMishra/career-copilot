schemaVersion: 1
id: s04-block-unsafe-onboarding
description: "S04: URLs, recognized filenames, upload/attach requests, non-text input, foreign commands, overlength text, and direct identifiers are blocked before the model; ordinary career facts still reach the responder."
kind: contract
persona: P09
fixture: new-owner
stubs: [s04-model]
turns:
  - { id: t1, channel: telegram, input: { kind: text, text: "/onboarding" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t2, channel: telegram, input: { kind: text, text: "https://linkedin.com/jobs/view/1" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t3, channel: telegram, input: { kind: text, text: "resume.pdf" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t4, channel: telegram, input: { kind: text, text: "attach my CV" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t5, channel: telegram, input: { kind: text, text: "/save https://linkedin.com/jobs/view/1" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t6, channel: telegram, input: { kind: text, text: "" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t7, channel: telegram, input: { kind: text, text: "canary@example.test" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t8, channel: telegram, input: { kind: text, text: "+1 202-555-0100" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t9, channel: telegram, input: { kind: text, text: "SSN 123-45-6789" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t10, channel: telegram, input: { kind: text, text: "token=CANARY_SECRET" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t11, channel: telegram, input: { kind: text, text: "I am a CV engineer building image recognition and distributed file systems in Mumbai with TypeScript." }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
  - { id: t12, channel: telegram, input: { kind: non_text }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
assertions:
  - A-ONBOARDING-STATE
  - A-DRAFT-PATCH-ONLY
  - A-NO-ACTIVATION-BEFORE-CONFIRM
  - A-TOOLS-EXACT
  - A-TRANSCRIPT-COMPLETE
  - A-BUDGET
  - A-CANARY-CONTAINED
  - A-AUTH-BEFORE-MODEL
  - A-LOG-ALLOWLIST
  - A-ISOLATED-FIXTURE
  - A-NO-UNHANDLED-ERROR
  - { id: A-ONBOARDING-STATE, path: "state.onboarding[0].status", op: eq, value: collecting }
  - { id: A-ONBOARDING-STATE, path: "state.onboarding[0].version", op: eq, value: 2 }
  - { id: A-DRAFT-PATCH-ONLY, path: "state.onboarding[0].draft.currentStatus", op: eq, value: "CV engineer building image recognition and distributed file systems in Mumbai." }
  - { id: A-DRAFT-PATCH-ONLY, path: "state.onboarding[0].draft.skills", op: eq, value: "TypeScript" }
tools:
  counts: { save-job: 0, job-status: 0, job-queue: 0 }
limits: { maxTurns: 15, maxWallClockMs: 60000, maxModelCalls: 8 }
