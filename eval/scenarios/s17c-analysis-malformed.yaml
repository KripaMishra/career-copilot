schemaVersion: 1
id: s17c-analysis-malformed
description: "S17 analysis: an invalid analysis schema fails the job safely; no success-only report or claim exists."
kind: contract
persona: P12
fixture: active-profile
stubs: [normal-job-page, s17-analysis-malformed]
turns:
  - { id: t1, channel: telegram, input: { kind: text, text: "/save https://linkedin.com/jobs/view/1" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
assertions:
  - A-TOOLS-EXACT
  - A-TOOL-CONTEXT
  - A-URL-POLICY
  - A-SAFE-ERROR
  - A-JOB-STATE
  - A-REPORT-BEFORE-SUCCESS
  - A-TRANSCRIPT-COMPLETE
  - A-BUDGET
  - A-CANARY-CONTAINED
  - A-AUTH-BEFORE-MODEL
  - A-LOG-ALLOWLIST
  - A-ISOLATED-FIXTURE
  - A-NO-UNHANDLED-ERROR
  - { id: A-JOB-STATE, path: "state.jobs", op: count, value: 1 }
  - { id: A-JOB-STATE, path: "state.jobs[0].status", op: eq, value: failed }
  - { id: A-SAFE-ERROR, path: "state.jobs[0].safeError", op: eq, value: "Job processing failed; use /job for recovery." }
  - { id: A-REPORT-BEFORE-SUCCESS, path: "state.reports", op: count, value: 0 }
tools:
  require: [save-job]
  counts: { save-job: 1 }
limits: { maxTurns: 5, maxWallClockMs: 60000, maxModelCalls: 10 }
