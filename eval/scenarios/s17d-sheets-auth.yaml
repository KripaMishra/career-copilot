schemaVersion: 1
id: s17d-sheets-auth
description: "S17 sheets: tracker authorization failure fails the job with the tracker category; the already-saved report remains but no verified row or success exists."
kind: contract
persona: P12
fixture: active-profile
stubs: [normal-job-page, s17-sheets-auth]
turns:
  - { id: t1, channel: telegram, input: { kind: text, text: "/save https://linkedin.com/jobs/view/1" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
assertions:
  - A-TOOLS-EXACT
  - A-TOOL-CONTEXT
  - A-SAFE-ERROR
  - A-JOB-STATE
  - A-REPORT-BEFORE-SUCCESS
  - A-SHEET-READBACK
  - A-TRANSCRIPT-COMPLETE
  - A-BUDGET
  - A-CANARY-CONTAINED
  - A-AUTH-BEFORE-MODEL
  - A-LOG-ALLOWLIST
  - A-ISOLATED-FIXTURE
  - A-NO-UNHANDLED-ERROR
  - { id: A-JOB-STATE, path: "state.jobs", op: count, value: 1 }
  - { id: A-JOB-STATE, path: "state.jobs[0].status", op: eq, value: failed }
  - { id: A-SAFE-ERROR, path: "state.jobs[0].safeError", op: eq, value: "Job tracker authorization failed." }
  - { id: A-SHEET-READBACK, path: "state.sheets", op: count, value: 0 }
tools:
  require: [save-job]
  counts: { save-job: 1 }
limits: { maxTurns: 5, maxWallClockMs: 60000, maxModelCalls: 10 }
