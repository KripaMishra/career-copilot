schemaVersion: 1
id: s17g-redirect-unsafe
description: "S17 fetch: an off-site redirect is rejected by the same-site policy before following; the job fails safely."
kind: contract
persona: P12
fixture: active-profile
stubs: [s17-redirect-unsafe]
turns:
  - { id: t1, channel: telegram, input: { kind: text, text: "/save https://linkedin.com/jobs/view/1" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
assertions:
  - A-TOOLS-EXACT
  - A-TOOL-CONTEXT
  - A-URL-POLICY
  - A-REDIRECT-POLICY
  - A-SAFE-ERROR
  - A-JOB-STATE
  - A-TRANSCRIPT-COMPLETE
  - A-BUDGET
  - A-CANARY-CONTAINED
  - A-AUTH-BEFORE-MODEL
  - A-LOG-ALLOWLIST
  - A-ISOLATED-FIXTURE
  - A-NO-UNHANDLED-ERROR
  - { id: A-JOB-STATE, path: "state.jobs", op: count, value: 1 }
  - { id: A-JOB-STATE, path: "state.jobs[0].status", op: eq, value: failed }
  - { id: A-SAFE-ERROR, path: "state.jobs[0].safeError", op: eq, value: "Job content could not be fetched safely." }
tools:
  require: [save-job]
  counts: { save-job: 1 }
limits: { maxTurns: 5, maxWallClockMs: 60000, maxModelCalls: 10 }
