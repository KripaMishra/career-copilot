schemaVersion: 1
id: s12-grounded-analysis
description: "S12: analysis facts (title/company) come from the fetched page and profile; the persisted summary matches the structured analysis exactly and carries no contradictions."
kind: contract
persona: P07
fixture: active-profile
stubs: [normal-job-page, s12-model]
turns:
  - { id: t1, channel: telegram, input: { kind: text, text: "/save https://linkedin.com/jobs/view/1" }, actorId: "1001", conversationId: "telegram:2001", expected: accepted }
assertions:
  - A-TOOLS-EXACT
  - A-TOOL-CONTEXT
  - A-LIFECYCLE-ORDER
  - A-JOB-STATE
  - A-REPORT-BEFORE-SUCCESS
  - A-NOTIFY-AFTER-COMPLETE
  - A-NOTIFY-MARK-AFTER-SEND
  - A-CANARY-CONTAINED
  - A-TRANSCRIPT-COMPLETE
  - A-BUDGET
  - A-AUTH-BEFORE-MODEL
  - A-LOG-ALLOWLIST
  - A-ISOLATED-FIXTURE
  - A-NO-UNHANDLED-ERROR
  - { id: A-JOB-STATE, path: "state.jobs", op: count, value: 1 }
  - { id: A-JOB-STATE, path: "state.jobs[0].status", op: eq, value: succeeded }
  - { id: A-JOB-STATE, path: "state.jobs[0].safeResult.summary", op: eq, value: "Senior Backend Engineer at Acme Corp: Apply on the company careers page." }
tools:
  require: [save-job]
  forbid: [web_fetch, job-status, job-queue]
  counts: { save-job: 1 }
limits: { maxTurns: 5, maxWallClockMs: 60000, maxModelCalls: 20 }
