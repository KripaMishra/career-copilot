schemaVersion: 1
id: s17-sheets-auth
ownerId: career-owner-v0
sheets:
  failure: auth
model:
  responses:
    - purpose: chat
      match: "Save this job now"
      toolCalls:
        - toolName: save-job
          args:
            url: "https://linkedin.com/jobs/view/1"
            profileContext: "Senior backend/GenAI engineer."
    - purpose: analysis
      object:
        schemaVersion: 1
        title: "Senior Backend Engineer"
        company: "Acme Corp"
        location: "Remote India"
        summary: "Backend role."
        fitScore: 80
        nextStep: "Apply on the company careers page."
    - purpose: chat
      text: "The job could not be saved safely."
