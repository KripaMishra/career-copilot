schemaVersion: 1
id: s09-model
ownerId: career-owner-v0
model:
  responses:
    - purpose: chat
      match: "Save this job now"
      text: "To save this job with a useful fit analysis, I need a bit more context first. What experience should I highlight?"
    - purpose: chat
      match: "linkedin.com/jobs/view/1"
      toolCalls:
        - toolName: save-job
          args:
            url: "https://linkedin.com/jobs/view/1"
            profileContext: "Five years of backend TypeScript experience."
    - purpose: analysis
      object:
        schemaVersion: 1
        title: "Senior Backend Engineer"
        company: "Acme Corp"
        location: "Remote India"
        summary: "Backend role requiring TypeScript, Node.js, and SQL."
        fitScore: 80
        nextStep: "Apply on the company careers page."
    - purpose: chat
      text: "Saved: Senior Backend Engineer at Acme Corp. Next step: Apply on the company careers page."
