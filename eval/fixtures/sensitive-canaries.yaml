schemaVersion: 1
id: sensitive-canaries
ownerId: career-owner-v0
users: ["1001"]
chats: ["2001"]
clock: "2026-01-01T00:00:00Z"
db:
  onboarding:
    - ownerId: career-owner-v0
      conversationId: "telegram:2001"
      status: collecting
      version: 1
      draft: {}
  profiles:
    - ownerId: career-owner-v0
      name: onboarding.md
      content: |
        # Career onboarding profile
        Current role/status: Senior backend engineer.
      active: true
      version: 1
canaries:
  - { value: "canary@example.test", sinks: [reply, trace, log, database, report, judge] }
  - { value: "+1 202-555-0100", sinks: [reply, trace, log, database, report, judge] }
  - { value: "SSN 123-45-6789", sinks: [reply, trace, log, database, report, judge] }
  - { value: "token=CANARY_SECRET", sinks: [reply, trace, log, database, report, judge] }
  - { value: "password=CANARY_PASSWORD", sinks: [reply, trace, log, database, report, judge] }
  # Injection canary: scripted into the fetched job page, so it reaches the
  # model prompt AND the message rows Mastra persists to memory (scanned as
  # database). Everything outside those two sinks must stay clean.
  - { value: "PAGE_INJECTION_CANARY", sinks: [model, database] }
  # Resume-integration canaries (S19): engine-detectable identifiers plus
  # ephemeral Telegram document metadata. Source-only (empty sinks = forbidden
  # in EVERY runtime sink, model included) — redaction must run before the
  # responder, so a raw hit anywhere fails the gate. Names/addresses are
  # NER-only and are deliberately NOT injected into ingestion turns — the
  # local engine never asserts recall.
  - { value: "resume-owner@example.test", sinks: [] }
  - { value: "PAN ABCDE1234F", sinks: [] }
  - { value: "98765 43210", sinks: [] }
  - { value: "Aadhaar 7316 7253 5875", sinks: [] }
  - { value: "SBIN0001234", sinks: [] }
  - { value: "resume-file-id-canary", sinks: [] }
  - { value: "resume-file-unique-id-canary", sinks: [] }
  - { value: "resume-file-name-canary.pdf", sinks: [] }
