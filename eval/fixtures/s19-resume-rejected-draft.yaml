ownerId: career-owner-v0
users: ["1001"]
chats: ["2001"]
clock: "2026-01-01T00:00:00Z"
pii: true
db:
  onboarding:
    - ownerId: career-owner-v0
      conversationId: "telegram:2001"
      status: collecting
      version: 1
      draft: {}
documents:
