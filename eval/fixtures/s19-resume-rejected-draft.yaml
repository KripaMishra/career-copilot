    fileName: "resume.pdf"
    mimeType: "application/pdf"
    fileSize: 1024
    text: "Engineer with backend focus and eight years of experience."
model:
  responses:
    - purpose: memory
      text: "{}"
    - purpose: onboarding
      match: "Resume document processed safely"
      object:
        reply: "Resume received."
        draftPatch:
          currentStatus: "Engineer at IFSC SBIN0001234"
        readyForReview: false
canaries:
