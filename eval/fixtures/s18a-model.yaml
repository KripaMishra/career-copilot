schemaVersion: 1
id: s18a-model
ownerId: career-owner-v0
model:
  responses:
    - purpose: chat
      match: "https://linkedin.com/jobs/view/1"
      toolCalls:
        - toolName: save-job
          args:
            url: "https://linkedin.com/jobs/view/1"
            profileContext: "Senior backend/GenAI engineer; TypeScript, Node.js, SQL; remote India."
    - purpose: analysis
      object:
        schemaVersion: 1
        title: "Senior Backend Engineer"
        company: "Acme Corp"
        location: "Remote India"
        summary: "Backend role requiring TypeScript, Node.js, and SQL."
        fitScore: 80
        nextStep: "Apply on the company careers page."
    - purpose: chat
      text: "Recovered: Senior Backend Engineer at Acme Corp."
    - purpose: chat
      match: "hello"
      text: "Hello! Your saved jobs are safe."
